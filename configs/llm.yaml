# 多供应商 LLM 路由配置
#
# 设计原则:
# - models 只登记真实上游模型 ID；key 必须等于 provider_model_id，避免别名套娃。
# - nodes 负责每个 LangGraph 节点的主模型、同模型重试次数和 fallback 链。
# - .env 只保存 base_url/api_key 等敏感或环境相关信息。

mode: router
default_model: xopqwen36v35b

providers:
  siliconflow:
    type: openai_compatible
    base_url_env: LLM_SILICONFLOW_BASE_URL
    api_key_env: LLM_SILICONFLOW_API_KEY

  deepseek_official:
    type: openai_compatible
    base_url_env: LLM_DEEPSEEK_BASE_URL
    api_key_env: LLM_DEEPSEEK_API_KEY

  openrouter:
    type: openai_compatible
    base_url_env: LLM_OPENOUTER_BASE_URL
    api_key_env: LLM_OPENOUTER_API_KEY

  xunfeid:
    type: openai_compatible
    base_url_env: LLM_XUNFEI_BASE_URL
    api_key_env: LLM_XUNFEI_API_KEY

models:
  xopqwen36v35b:
    provider: xunfeid
    provider_model_id: xopqwen36v35b

  deepseek-ai/DeepSeek-V4-Pro:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Pro

  deepseek-ai/DeepSeek-V4-Flash:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Flash

  Qwen/Qwen2.5-7B-Instruct:
    provider: siliconflow
    provider_model_id: Qwen/Qwen2.5-7B-Instruct

  Pro/deepseek-ai/DeepSeek-V3.2:
    provider: siliconflow
    provider_model_id: Pro/deepseek-ai/DeepSeek-V3.2

  Pro/moonshotai/Kimi-K2.6:
    provider: siliconflow
    provider_model_id: Pro/moonshotai/Kimi-K2.6

  Pro/zai-org/GLM-5.1:
    provider: siliconflow
    provider_model_id: Pro/zai-org/GLM-5.1

  zai-org/GLM-5.2:
    provider: siliconflow
    provider_model_id: zai-org/GLM-5.2

  deepseek-v4-pro:
    provider: deepseek_official
    provider_model_id: deepseek-v4-pro

  deepseek-v4-flash:
    provider: deepseek_official
    provider_model_id: deepseek-v4-flash

  deepseek/deepseek-v4-pro:
    provider: openrouter
    provider_model_id: deepseek/deepseek-v4-pro

  google/gemini-2.5-flash-lite:
    provider: openrouter
    provider_model_id: google/gemini-2.5-flash-lite

  moonshotai/kimi-k2.6:
    provider: openrouter
    provider_model_id: moonshotai/kimi-k2.6

  z-ai/glm-4.6:
    provider: openrouter
    provider_model_id: z-ai/glm-4.6

nodes:
  # 节点级策略: 主模型试 3 次；当前 Router 中 fallback 模型各试 1 次。
  content_check:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  field_analyst:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  se_check:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  ae_check:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  reviewer1:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  reviewer2:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  reviewer3:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  single_reviewer:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  devils_advocate:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

  ae_final:
    primary_model: xopqwen36v35b
    max_attempts: 3
    fallback_models:
      - deepseek-v4-flash
      - deepseek-v4-pro
      - deepseek-ai/DeepSeek-V4-Pro
      - zai-org/GLM-5.2

prompts:
  content_check:
    temperature: 0
    top_p: 0.9
    max_tokens: 256

  field_analyst:
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2000

  se_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 2000

  ae_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 3000

  reviewer1:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer2:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer3:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  single_reviewer:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 6000

  devils_advocate:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 6000

  ae_final:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 5000

# 多供应商 LLM 路由配置
#
# 设计原则:
# - prompts/*.md 只写节点想用的 model id。
# - 这里登记 model id 属于哪个 provider，以及真实上游模型名。
# - .env 只保存 base_url/api_key 等敏感或环境相关信息。

mode: router
default_model: sf/deepseek-v4-pro

providers:
  siliconflow:
    type: openai_compatible
    base_url_env: LLM_SILICONFLOW_BASE_URL
    api_key_env: LLM_SILICONFLOW_API_KEY

  deepseek_official:
    type: openai_compatible
    base_url_env: LLM_DEEPSEEK_BASE_URL
    api_key_env: LLM_DEEPSEEK_API_KEY

  openrouter:
    type: openai_compatible
    base_url_env: LLM_OPENOUTER_BASE_URL
    api_key_env: LLM_OPENOUTER_API_KEY

models:
  sf/deepseek-v4-pro:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Pro
    max_attempts: 2
    fallback_models:
      - sf/deepseek-v4-flash
      - sf/qwen2.5-7b-instruct

  sf/deepseek-v4-flash:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Flash
    max_attempts: 2
    fallback_models:
      - sf/qwen2.5-7b-instruct

  sf/qwen2.5-7b-instruct:
    provider: siliconflow
    provider_model_id: Qwen/Qwen2.5-7B-Instruct
    max_attempts: 1

  sf/deepseek-v3.2-pro:
    provider: siliconflow
    provider_model_id: Pro/deepseek-ai/DeepSeek-V3.2

  sf/kimi-k2.6:
    provider: siliconflow
    provider_model_id: Pro/moonshotai/Kimi-K2.6

  sf/glm-5.1:
    provider: siliconflow
    provider_model_id: Pro/zai-org/GLM-5.1

  deepseek/deepseek-v4-pro:
    provider: deepseek_official
    provider_model_id: deepseek-v4-pro
    max_attempts: 2
    fallback_models:
      - sf/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  deepseek/deepseek-v4-flash:
    provider: deepseek_official
    provider_model_id: deepseek-v4-flash
    max_attempts: 2
    fallback_models:
      - sf/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  openrouter/deepseek-v4-pro:
    provider: openrouter
    provider_model_id: deepseek/deepseek-v4-pro

  openrouter/gemini-2.5-flash-lite:
    provider: openrouter
    provider_model_id: google/gemini-2.5-flash-lite
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  openrouter/kimi-k2.6:
    provider: openrouter
    provider_model_id: moonshotai/kimi-k2.6

  openrouter/glm-4.6:
    provider: openrouter
    provider_model_id: z-ai/glm-4.6
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

prompts:
  content_check:
    temperature: 0
    top_p: 0.9
    max_tokens: 256

  field_analyst:
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2000

  se_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 2000

  ae_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 3000

  reviewer1:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer2:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer3:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  devils_advocate:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 6000

  ae_final:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 5000

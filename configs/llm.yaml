# 多供应商 LLM 路由配置
#
# 设计原则:
# - models 只登记稳定模型别名属于哪个 provider，以及真实上游模型名。
# - nodes 负责每个 LangGraph 节点的主模型、同模型重试次数和 fallback 链。
# - .env 只保存 base_url/api_key 等敏感或环境相关信息。

mode: router
default_model: review-main-model

providers:
  siliconflow:
    type: openai_compatible
    base_url_env: LLM_SILICONFLOW_BASE_URL
    api_key_env: LLM_SILICONFLOW_API_KEY

  deepseek_official:
    type: openai_compatible
    base_url_env: LLM_DEEPSEEK_BASE_URL
    api_key_env: LLM_DEEPSEEK_API_KEY

  openrouter:
    type: openai_compatible
    base_url_env: LLM_OPENOUTER_BASE_URL
    api_key_env: LLM_OPENOUTER_API_KEY

  xunfeid:
    type: openai_compatible
    base_url_env: LLM_XUNFEI_BASE_URL
    api_key_env: LLM_XUNFEI_API_KEY

models:
  # 主审稿模型别名: 节点策略引用这个名字，后续切真实模型只改 provider_model_id。
  review-main-model:
    provider: xunfeid
    provider_model_id: xopqwen36v35b

  xopqwen36v35b:
    provider: xunfeid
    provider_model_id: xopqwen36v35b

  sf/deepseek-v4-pro:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Pro

  sf/deepseek-v4-flash:
    provider: siliconflow
    provider_model_id: deepseek-ai/DeepSeek-V4-Flash

  sf/qwen2.5-7b-instruct:
    provider: siliconflow
    provider_model_id: Qwen/Qwen2.5-7B-Instruct

  sf/deepseek-v3.2-pro:
    provider: siliconflow
    provider_model_id: Pro/deepseek-ai/DeepSeek-V3.2

  sf/kimi-k2.6:
    provider: siliconflow
    provider_model_id: Pro/moonshotai/Kimi-K2.6

  sf/glm-5.1:
    provider: siliconflow
    provider_model_id: Pro/zai-org/GLM-5.1

  deepseek/deepseek-v4-pro:
    provider: deepseek_official
    provider_model_id: deepseek-v4-pro

  deepseek/deepseek-v4-flash:
    provider: deepseek_official
    provider_model_id: deepseek-v4-flash

  openrouter/deepseek-v4-pro:
    provider: openrouter
    provider_model_id: deepseek/deepseek-v4-pro

  openrouter/gemini-2.5-flash-lite:
    provider: openrouter
    provider_model_id: google/gemini-2.5-flash-lite

  openrouter/kimi-k2.6:
    provider: openrouter
    provider_model_id: moonshotai/kimi-k2.6

  openrouter/glm-4.6:
    provider: openrouter
    provider_model_id: z-ai/glm-4.6

nodes:
  # 节点级策略: 主模型试 2 次；fallback 模型各试 1 次。
  content_check:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  field_analyst:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  se_check:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  ae_check:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  reviewer1:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  reviewer2:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  reviewer3:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  single_reviewer:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  devils_advocate:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

  ae_final:
    primary_model: review-main-model
    max_attempts: 2
    fallback_models:
      - deepseek/deepseek-v4-pro
      - sf/qwen2.5-7b-instruct

prompts:
  content_check:
    temperature: 0
    top_p: 0.9
    max_tokens: 256

  field_analyst:
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2000

  se_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 2000

  ae_check:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 3000

  reviewer1:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer2:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  reviewer3:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4000

  single_reviewer:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 6000

  devils_advocate:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 6000

  ae_final:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 5000

[project]
name = "paper-review-agent"
version = "0.1.0"
description = "Local-first multi-agent paper review framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "pymupdf>=1.24,<2",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "python-docx>=1.1,<2",
]

[project.scripts]
paper-review = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
